name: Java build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: currency-compass-jar
          path: target/currency-converter-1.0.0.jar
